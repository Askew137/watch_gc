name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APKs
        run: ./gradlew :mobile:assembleDebug :wear:assembleDebug

      - name: Upload Mobile Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug
          path: mobile/build/outputs/apk/debug/mobile-debug.apk

      - name: Upload Wear Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wear-debug
          path: wear/build/outputs/apk/debug/wear-debug.apk

  release:
    name: Release APKs
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APKs
        run: ./gradlew :mobile:assembleRelease :wear:assembleRelease

      - name: Upload release APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/build/outputs/apk/release/mobile-release.apk
            wear/build/outputs/apk/release/wear-release.apk
